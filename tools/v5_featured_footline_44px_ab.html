<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gray Crown | V5 NPC footline 44px native A/B</title>
<style>
:root{color-scheme:dark}body{font:15px/1.5 system-ui,sans-serif;background:#20282a;color:#e5e7dc;max-width:980px;margin:24px auto;padding:0 14px}
h1{font-size:22px;margin:0 0 8px}p{max-width:900px}button{padding:9px 16px;border:1px solid #8f9e8e;border-radius:5px;background:#394c46;color:#fff;cursor:pointer}
canvas{background:#657953;image-rendering:pixelated;max-width:100%;height:auto;display:block;border:1px solid #9aa38d}
.note{font-size:13px;color:#bac9b8}a{color:#b7dcb6}
</style></head><body>
<h1>王国使者・村長 V5 / 足元接地 A/B</h1>
<p>GitHubの実PNGを読み込み、正面・左・右・背面を<strong>同じ44px・同じ背景・同じ影・同じ座標</strong>で比較します。上段が現在の表示、下段が原画のy=44を足元基準に合わせた試作です。最下段はマーガレット現行原画（比較用）。</p>
<p><button id="grass">草地</button> <button id="path">道</button> <button id="toggle">足元ガイド切替</button></p>
<canvas id="stage" width="760" height="630" aria-label="実素材の44px比較"></canvas>
<pre id="metrics" class="note" aria-live="polite"></pre>
<p class="note">このページはゲーム本編のスクリーンショットではありません。画像の構造・表示条件を揃えた資料です。ゲーム本編の比較は <code>?gcV5Footline=44</code> を追加して確認します。未承認・本番未変更。</p>
<script>
'use strict';
const canvas=document.getElementById('stage'),c=canvas.getContext('2d');
c.imageSmoothingEnabled=false;
const assets={
 npc:'../assets/npc/featured_residents_charm_v5.png',
 margaret:'../assets/characters/margaret/margaret_walk.png'
};
const images={},ready={},errors={};let ground='grass',guides=true;
for(const [key,src] of Object.entries(assets)){
 const img=new Image();images[key]=img;
 img.onload=()=>{ready[key]=true;render()};
 img.onerror=()=>{errors[key]=true;render()};
 img.src=src;
}
function label(text,x,y,size=13){c.font=size+'px system-ui,sans-serif';c.fillStyle='#f7f4e5';c.fillText(text,x,y)}
function groundCell(x,y,footY){
 c.fillStyle=ground==='grass'?'#6b8059':'#b39b70';c.fillRect(x,y,66,66);
 c.fillStyle=ground==='grass'?'#56744b':'#947c5c';
 c.fillRect(x+8,y+10,4,2);c.fillRect(x+49,y+34,6,2);c.fillRect(x+23,y+51,3,2);
 c.fillStyle='rgba(16,18,18,.25)';c.beginPath();c.ellipse(x+33,footY-1,9,3,0,0,Math.PI*2);c.fill();
 if(guides){c.fillStyle='#f4d479';c.fillRect(x+5,footY,56,1)}
}
function sprite(x,y,who,index,dir,mode){
 const cellX=x,footY=y+58;groundCell(cellX,y,footY);
 if(!ready[who])return;
 const img=images[who],srcX=who==='npc'?index*48:0,srcY=dir*48;
 const cx=cellX+33,destX=Math.round(cx-22);
 const destY=mode==='default'?footY-44:footY-Math.round(44*44/48);
 c.drawImage(img,srcX,srcY,48,48,destX,destY,44,44);
}
function alphaFoot(who,index,dir){
 if(!ready[who])return '?';
 const off=document.createElement('canvas');off.width=48;off.height=48;
 const g=off.getContext('2d',{willReadFrequently:true});
 g.drawImage(images[who],who==='npc'?index*48:0,dir*48,48,48,0,0,48,48);
 const data=g.getImageData(0,0,48,48).data;
 let last=-1;
 // Foot-region occupancy: ignore outer weapons/capes where possible.
 for(let yy=47;yy>=0;yy--){
  for(let xx=13;xx<=34;xx++)if(data[(yy*48+xx)*4+3]>=64){last=yy;break}
  if(last>=0)break;
 }
 return last;
}
function showMetrics(){
 if(!ready.npc||!ready.margaret)return;
 const entries=[['村長','npc',3],['王国使者','npc',4],['マーガレット','margaret',0]];
 document.getElementById('metrics').textContent='原画48px：中心部 x13〜34 の最下端不透明ピクセル（α≥64）\n'
  +entries.map(([name,who,index])=>name+'  '+[0,1,2,3].map(d=>alphaFoot(who,index,d)).join(' / ')+'  [正面 / 左 / 右 / 背面]').join('\n')
  +'\n※この値は画像の足元を推定する補助情報。影・靴・衣装の形状を目視確認して採否を決める。';
}
function render(){
 c.imageSmoothingEnabled=false;c.fillStyle='#20282a';c.fillRect(0,0,760,630);
 label('V5: 現行の足元基準（原画 y=48 を地面に合わせる）',18,25,15);
 const xs=[190,305,420,535],names=['正面','左','右','背面'];
 for(let i=0;i<4;i++)label(names[i],xs[i]+8,48);
 const people=[['村長',3],['王国使者',4]];
 let y=63;
 for(const [name,index] of people){
  label(name+' / 現行',16,y+32);
  for(let i=0;i<4;i++)sprite(xs[i],y,'npc',index,i,'default');
  y+=76;
  label(name+' / y44案',16,y+32);
  for(let i=0;i<4;i++)sprite(xs[i],y,'npc',index,i,'study');
  y+=91;
 }
 label('マーガレット / 現行原画（基準）',16,y+28);
 for(let i=0;i<4;i++)sprite(xs[i],y,'margaret',0,i,'study');
 y+=90;
 label('黄色の細線はゲームの地面足元座標。原画自体の形・色は変更していません。',16,y,13);
 if(Object.keys(errors).length)label('画像読み込み失敗: '+Object.keys(errors).join(', '),16,y+25,13);
 showMetrics();
}
document.getElementById('grass').onclick=()=>{ground='grass';render()};
document.getElementById('path').onclick=()=>{ground='path';render()};
document.getElementById('toggle').onclick=()=>{guides=!guides;render()};
render();
</script></body></html>

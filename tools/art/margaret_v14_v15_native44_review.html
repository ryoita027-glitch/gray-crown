<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gray Crown — V14A / V15 native 44px art contact</title>
<style>
body{background:#20272b;color:#e6e9e9;font:14px/1.5 system-ui,sans-serif;max-width:1000px;margin:16px auto;padding:0 12px}
h1{font-size:20px}p{max-width:85ch}strong{color:#ffcfb4}label{display:inline-flex;gap:5px;align-items:center;margin:4px 14px 8px 0}
select,input{accent-color:#9db7cb}select{background:#34424a;color:#fff;border:1px solid #7b8a90;padding:5px}
#board{display:grid;grid-template-columns:repeat(8,minmax(65px,1fr));gap:5px;overflow-x:auto}
figure{margin:0;padding:4px;min-width:0;border:1px solid #4c5961}
figure.candidate{border-color:#a4a3c2}
canvas{display:block;width:44px;height:60px;image-rendering:pixelated;image-rendering:crisp-edges}
body.zoom canvas{width:132px;height:180px}
body.zoom #board{grid-template-columns:repeat(8,142px)}
figcaption{font-size:10px;line-height:1.3;margin-top:4px;color:#cbd5d8}
#status{white-space:pre-wrap}
</style></head><body>
<h1>マーガレット V14A / V15 — 主人公・V5 NPC 44px比較</h1>
<p><strong>ART HOLD / NOT A GAME SCREENSHOT.</strong> 元の48px原画をゲーム表示の44pxへ最近傍縮小。4方向・同一背景・同一足元線で比較します。試作の採用判定はリュネ村の実Canvas比較後です。</p>
<label>背景 <select id="background"><option value="grass">草地</option><option value="stone">石畳</option><option value="gray">グレー</option></select></label>
<label>足元 <select id="anchor"><option value="contact">可視足元を一致</option><option value="nominal">原画の名目アンカー</option></select></label>
<label>待機コマ <input id="frame" type="range" min="0" max="3" value="0"><output id="frameValue">1/4</output></label>
<label>検討用拡大 <input id="zoom" type="checkbox">3倍（採用判定は44px）</label>
<div id="board"></div><p id="status">Loading sprite atlases…</p>
<p>左からカレン、トリトン、ソフィ、マーガレット原画、V14A、V15、村長V5、王国使者V5。上から正面、左、右、背面。歩行・会話・戦闘時の一致はこのページでは確認できません。</p>
<script>
'use strict';
const specs=[
 ['Karen','../../assets/characters/karen/karen_idle.png',0,true],
 ['Triton','../../assets/characters/triton/triton_idle.png',0,true],
 ['Sophie','../../assets/characters/sophie/sophie_idle.png',0,true],
 ['Margaret original','../../assets/characters/margaret/margaret_idle.png',0,true],
 ['Margaret V14A','../../assets/character_trials/margaret_idle_neck_torso_v14A.png',0,true],
 ['Margaret V15','../../assets/character_trials/margaret_idle_hair_robe_contact_v15.png',0,true],
 ['Mayor V5','../../assets/npc/featured_residents_charm_v5.png',3,false],
 ['Messenger V5','../../assets/npc/featured_residents_charm_v5.png',4,false]
].map(([name,url,col,hero])=>({name,url,col,hero}));
const directions=['正面','左','右','背面'],cells=[],images=new Map();
const board=document.getElementById('board'),background=document.getElementById('background');
const anchor=document.getElementById('anchor'),frame=document.getElementById('frame');
const probe=document.createElement('canvas');probe.width=44;probe.height=44;
const pc=probe.getContext('2d',{willReadFrequently:true});
for(let d=0;d<4;d++)for(let c=0;c<specs.length;c++){
 const fig=document.createElement('figure'),cv=document.createElement('canvas'),cap=document.createElement('figcaption');
 cv.width=44;cv.height=60;cap.textContent=directions[d]+' / '+specs[c].name;
 if(c===4||c===5)fig.className='candidate';
 fig.append(cv,cap);board.append(fig);cells.push(cv);
}
for(const spec of specs)if(!images.has(spec.url)){
 const im=new Image();images.set(spec.url,im);im.onload=render;im.onerror=render;im.src=spec.url;
}
function foot(im,s,d,f){
 pc.clearRect(0,0,44,44);pc.imageSmoothingEnabled=false;
 pc.drawImage(im,(s.col+(s.hero?f:0))*48,d*48,48,48,0,0,44,44);
 const p=pc.getImageData(0,0,44,44).data;
 for(let y=43;y>=0;y--)for(let x=0;x<44;x++)if(p[(y*44+x)*4+3])return y;
 return -1;
}
function paint(ctx){
 const type=background.value;
 for(let y=0;y<60;y+=4)for(let x=0;x<44;x+=4){
  const a=(x/4+y/4)%2===0;
  ctx.fillStyle=type==='grass'?(a?'#788b70':'#708367'):type==='stone'?(a?'#8a8982':'#77776f'):(a?'#858585':'#727272');
  ctx.fillRect(x,y,4,4);
 }
 ctx.fillStyle='#414b40';ctx.fillRect(0,48,44,1);
}
function render(){
 const f=Number(frame.value);document.getElementById('frameValue').textContent=(f+1)+'/4';
 const missing=[];
 for(let d=0;d<4;d++)for(let c=0;c<specs.length;c++){
  const s=specs[c],im=images.get(s.url),ctx=cells[d*specs.length+c].getContext('2d');
  ctx.imageSmoothingEnabled=false;paint(ctx);
  if(!im?.complete||!im.naturalWidth){missing.push(s.name);continue;}
  const bottom=foot(im,s,d,f);
  if(bottom<0){missing.push(s.name+' empty frame');continue;}
  const top=anchor.value==='contact'?48-bottom:48-Math.round((s.hero?46:44)*44/48);
  ctx.drawImage(im,(s.col+(s.hero?f:0))*48,d*48,48,48,0,top,44,44);
 }
 document.getElementById('status').textContent=missing.length?
  '読み込み失敗: '+[...new Set(missing)].join(', ')+'。リポジトリルートのHTTPサーバーから開いてください。':
  '全アトラス読み込み済み。静止画像の比較のみ。実ゲームの美術採用は HOLD。';
}
for(const e of [background,anchor,frame])e.addEventListener('input',render);
document.getElementById('zoom').addEventListener('change',e=>document.body.classList.toggle('zoom',e.target.checked));
render();
</script></body></html>

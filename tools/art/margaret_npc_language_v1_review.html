<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gray Crown — Margaret / V5 NPC 44px review (HOLD)</title>
<style>
body{font:14px/1.5 system-ui,sans-serif;background:#1c2227;color:#e8ebed;max-width:820px;margin:20px auto;padding:0 16px}
h1{font-size:20px}p{max-width:760px}.warning{color:#ffc6a6}
label{display:inline-block;margin:4px 10px 8px 0}button,select,input{accent-color:#c5cbd2}
button,select{background:#35424b;color:#f3f4f5;border:1px solid #788790;border-radius:4px;padding:6px}
#board{display:grid;grid-template-columns:repeat(4,minmax(65px,1fr));gap:8px}
figure{margin:0;padding:8px;border:1px solid #46525a;min-width:0}
canvas{display:block;width:44px;height:72px;image-rendering:pixelated;image-rendering:crisp-edges}
figcaption{font-size:11px;color:#c6cfd2;margin-top:5px;max-width:135px}
#status{white-space:pre-wrap;color:#c6cfd2}
</style></head><body>
<h1>マーガレット / 村長 / 王国使者：44px原寸比較</h1>
<p class="warning"><strong>ART HOLD — 本番採用禁止。</strong> 左から原画、輪郭・銀髪色面試作、V5村長、V5王国使者。上から正面・左・右・背面。全員48pxセルを44px最近傍で表示し、足元を54px行に合わせています。村長・使者は比較基準であり変更していません。</p>
<p><label>背景 <select id="background"><option value="grass">草地</option><option value="stone">石畳</option><option value="check">明暗チェッカー</option></select></label>
<label>待機コマ <input id="frame" type="range" min="0" max="3" step="1" value="0"><output id="frameValue">1 / 4</output></label>
<button type="button" id="play">待機を再生</button>
<button type="button" id="export">現在の44px比較をPNG保存</button></p>
<div id="board"></div>
<p id="status">原画像を読み込み中…</p>
<p>このツールはPNGの実寸・向き・待機4コマを検査するものです。リュネ村の実ゲームスクリーンショットではありません。元画像の顔・肌・足元・透明度は試作で変更していません。動作8種類や戦闘表示への展開も未承認です。</p>
<script>
'use strict';
const sources=[
 {name:'Margaret 原画',url:'../../assets/characters/margaret/margaret_idle.png',cell:0,foot:46,animate:true},
 {name:'Margaret 試作 / HOLD',url:'../../docs/art/evidence/margaret_idle_npc_language_v1_HOLD.png',cell:0,foot:46,animate:true},
 {name:'村長 V5',url:'../../assets/npc/featured_residents_charm_v5.png',cell:3,foot:44,animate:false},
 {name:'王国使者 V5',url:'../../assets/npc/featured_residents_charm_v5.png',cell:4,foot:44,animate:false}
];
const dirs=['正面','左','右','背面'],board=document.getElementById('board'),bg=document.getElementById('background'),slider=document.getElementById('frame'),status=document.getElementById('status');
const imgs=new Map(),canvases=[];
for(let direction=0;direction<4;direction++)for(let column=0;column<4;column++){
 const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');
 canvas.width=44;canvas.height=72;caption.textContent=dirs[direction]+' / '+sources[column].name;
 figure.append(canvas,caption);board.append(figure);canvases.push(canvas);
}
for(const source of sources)if(!imgs.has(source.url)){
 const img=new Image();imgs.set(source.url,img);img.onload=render;img.onerror=render;img.src=source.url;
}
function drawBackdrop(ctx){
 const type=bg.value;
 ctx.fillStyle=type==='grass'?'#7d8b79':type==='stone'?'#82817d':'#707070';
 ctx.fillRect(0,0,44,72);
 if(type==='check')for(let y=0;y<72;y+=4)for(let x=0;x<44;x+=4){
  if(((x+y)/4)%2===0){ctx.fillStyle='#919191';ctx.fillRect(x,y,4,4);}
 }else if(type==='grass')for(let y=0;y<72;y+=4)for(let x=0;x<44;x+=4){
  if(((x+y)/4)%2===0){ctx.fillStyle='#74836f';ctx.fillRect(x,y,4,4);}
 }
 ctx.fillStyle='rgba(30,38,33,.35)';ctx.fillRect(0,54,44,1);
}
function render(){
 const frame=Number(slider.value);document.getElementById('frameValue').textContent=(frame+1)+' / 4';
 let missing=[];
 for(let direction=0;direction<4;direction++)for(let column=0;column<4;column++){
  const source=sources[column],canvas=canvases[direction*4+column],ctx=canvas.getContext('2d'),img=imgs.get(source.url);
  ctx.imageSmoothingEnabled=false;drawBackdrop(ctx);
  if(!img||!img.complete||!img.naturalWidth){missing.push(source.name);continue;}
  const sx=(source.cell+(source.animate?frame:0))*48,sy=direction*48;
  const top=54-Math.round(source.foot*44/48);
  ctx.drawImage(img,sx,sy,48,48,0,top,44,44);
 }
 status.textContent=missing.length?'未読込：'+[...new Set(missing)].join('、')+'。リポジトリのルートでHTTPサーバーを起動してください。':
 '読み込み完了：原画と試作の同一ポーズ・同一倍率・同一背景・同一接地位置を比較中。美術採用はHOLD。';
}
let timer=null;
document.getElementById('play').addEventListener('click',e=>{
 if(timer){clearInterval(timer);timer=null;e.target.textContent='待機を再生';return;}
 timer=setInterval(()=>{slider.value=(Number(slider.value)+1)%4;render();},250);
 e.target.textContent='再生を停止';
});
slider.addEventListener('input',render);bg.addEventListener('change',render);
document.getElementById('export').addEventListener('click',()=>{
 const canvas=document.createElement('canvas');canvas.width=176;canvas.height=288;
 const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
 canvases.forEach((c,i)=>ctx.drawImage(c,(i%4)*44,Math.floor(i/4)*72));
 const link=document.createElement('a');link.href=canvas.toDataURL('image/png');
 link.download='margaret_npc_language_v1_native44_review_HOLD.png';link.click();
});
render();
</script></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gray Crown cast / V5 NPC — native 44px contact review</title>
<style>
body{background:#20262a;color:#e9ecef;font:14px/1.5 system-ui,sans-serif;max-width:970px;margin:20px auto;padding:0 12px}
h1{font-size:20px}.hold{color:#ffc7ac}label{margin-right:12px;display:inline-block}
select,input{accent-color:#b9c6d3}select{background:#35434c;color:#fff;padding:5px;border:1px solid #74828d}
#board{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:6px}
figure{margin:0;min-width:0;border:1px solid #45525a;padding:4px}canvas{width:44px;height:60px;display:block;image-rendering:pixelated}
figcaption{font-size:10px;line-height:1.3;color:#c7d2d6;margin-top:4px}
#status{white-space:pre-wrap}
</style></head><body>
<h1>主人公4人 / V5村長・王国使者：44px比較</h1>
<p class="hold"><strong>ART HOLD — 実ゲーム画面ではなく、実PNGを使ったオフライン比較。</strong> 同一背景・同一表示倍率。正面、左、右、背面の順。各列はカレン、トリトン、ソフィ、マーガレット、村長、王国使者。</p>
<p><label>接地 <select id="anchor"><option value="contact">44px実画素の最下端を一致</option><option value="nominal">旧比較の固定アンカー（検証用）</option></select></label>
<label>背景 <select id="background"><option value="grass">草地</option><option value="stone">石畳</option><option value="check">グレー</option></select></label>
<label>主人公待機コマ <input id="frame" type="range" min="0" max="3" value="0"><output id="fv">1 / 4</output></label></p>
<div id="board"></div><p id="status">画像を読み込み中</p>
<p>最下端合わせは美術比較専用です。ゲーム内の座標や影を再現するものではありません。旧固定アンカーとの違いは描画基準の差であり、実ゲームの不具合を示す証拠ではありません。</p>
<script>
'use strict';
const specs=[{"name":"Karen","url":"../../assets/characters/karen/karen_idle.png","cell":0,"hero":true},{"name":"Triton","url":"../../assets/characters/triton/triton_idle.png","cell":0,"hero":true},{"name":"Sophie","url":"../../assets/characters/sophie/sophie_idle.png","cell":0,"hero":true},{"name":"Margaret","url":"../../assets/characters/margaret/margaret_idle.png","cell":0,"hero":true},{"name":"Mayor V5","url":"../../assets/npc/featured_residents_charm_v5.png","cell":3,"hero":false},{"name":"Messenger V5","url":"../../assets/npc/featured_residents_charm_v5.png","cell":4,"hero":false}];
const dirs=['正面','左','右','背面'],images=new Map(),cells=[];
const anchor=document.getElementById('anchor'),bg=document.getElementById('background'),frame=document.getElementById('frame');
for(let d=0;d<4;d++)for(let c=0;c<6;c++){
 const fig=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');
 canvas.width=44;canvas.height=60;caption.textContent=dirs[d]+' / '+specs[c].name;
 fig.append(canvas,caption);document.getElementById('board').append(fig);cells.push(canvas);
}
for(const s of specs)if(!images.has(s.url)){
 const im=new Image();images.set(s.url,im);im.onload=render;im.onerror=render;im.src=s.url;
}
const probe=document.createElement('canvas');probe.width=44;probe.height=44;
const probeCtx=probe.getContext('2d',{willReadFrequently:true});
function bottom(im,s,d,f){
 probeCtx.clearRect(0,0,44,44);probeCtx.imageSmoothingEnabled=false;
 probeCtx.drawImage(im,(s.cell+(s.hero?f:0))*48,d*48,48,48,0,0,44,44);
 const a=probeCtx.getImageData(0,0,44,44).data;
 for(let y=43;y>=0;y--)for(let x=0;x<44;x++)if(a[(y*44+x)*4+3])return y;
 return -1;
}
function backdrop(ctx){
 const kind=bg.value;
 for(let y=0;y<60;y+=4)for(let x=0;x<44;x+=4){
  const alt=(x/4+y/4)%2===0;
  ctx.fillStyle=kind==='grass'?(alt?'#7d8b79':'#74836f'):
    kind==='stone'?(alt?'#82817d':'#74736e'):(alt?'#919191':'#707070');
  ctx.fillRect(x,y,4,4);
 }
 ctx.fillStyle='#596556';ctx.fillRect(0,48,44,1);
}
function render(){
 const f=Number(frame.value);document.getElementById('fv').textContent=(f+1)+' / 4';
 let missing=[],lines=[];
 for(let d=0;d<4;d++)for(let c=0;c<6;c++){
  const s=specs[c],im=images.get(s.url),ctx=cells[d*6+c].getContext('2d');
  ctx.imageSmoothingEnabled=false;backdrop(ctx);
  if(!im||!im.complete||!im.naturalWidth){missing.push(s.name);continue;}
  const foot=bottom(im,s,d,f);
  const offset=anchor.value==='contact'?48-foot:48-Math.round((s.hero?46:44)*44/48);
  ctx.drawImage(im,(s.cell+(s.hero?f:0))*48,d*48,48,48,0,offset,44,44);
  if(d===0)lines.push(s.name+': '+foot+'px (44px内の可視最下端)');
 }
 document.getElementById('status').textContent=missing.length?
  '読み込み失敗: '+[...new Set(missing)].join(' / ')+'。リポジトリルートでHTTPサーバーを起動してください。':
  '正面の可視最下端: '+lines.join(' / ')+'。正式な美術採用は未判定。';
}
for(const el of [anchor,bg,frame])el.addEventListener('input',render);
render();
</script></body></html>

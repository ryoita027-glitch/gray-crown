<!doctype html><html lang="ja"><meta charset="utf-8"><title>Margaret V24/V25 native44 review</title>
<style>body{background:#1b2423;color:#f1ede4;font:14px system-ui;padding:16px}canvas{image-rendering:pixelated;max-width:100%;height:auto}button{padding:8px 16px}p{max-width:960px}</style>
<h1>マーガレット歩行 V24 / V25 / 村長・王国使者V5 — 44px同条件</h1>
<p>4方向×6コマを実PNGから表示。同一背景・接地線・倍率。これは実ゲームCanvasではなく試作アートの比較です。V25はNO-GOです。</p>
<button id="toggle">6コマ再生 / 停止</button> <span id="status">画像読込中</span><canvas id="board" width="900" height="430"></canvas>
<script>
'use strict';
const paths=['../../assets/character_trials/margaret_walk_v24_leg_silhouette_trial.png','../../assets/character_trials/margaret_walk_v25_body_motion_trial.png','../../assets/npc/featured_residents_charm_v5.png'];
const imgs=paths.map(p=>{const im=new Image();im.src=p;return im});
const c=document.getElementById('board'),ctx=c.getContext('2d');let frame=0,timer=null;
function draw(){
 ctx.fillStyle='#1b2423';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#f1ede4';ctx.font='13px system-ui';ctx.textBaseline='top';
 ['V24 HOLD','V25 NO-GO','村長 V5','王国使者 V5'].forEach((s,i)=>ctx.fillText(s,[30,360,730,810][i],7));
 for(let d=0;d<4;d++){
  ctx.fillStyle='#f1ede4';ctx.fillText(['前','左','右','後'][d],3,52+d*99);
  for(let g=0;g<2;g++)for(let f=0;f<6;f++){
   const x=30+g*330+f*53,y=29+d*99;
   ctx.fillStyle=f===frame?'#829b7b':'#697e69';ctx.fillRect(x,y,50,55);
   ctx.fillStyle='#405946';ctx.fillRect(x,y+52,50,1);
   if(imgs[g].complete&&imgs[g].naturalWidth===288&&imgs[g].naturalHeight===192){ctx.imageSmoothingEnabled=false;ctx.drawImage(imgs[g],f*48,d*48,48,48,x+3,y+5,44,44)}
  }
  for(let n=0;n<2;n++){
   const x=730+n*80,y=29+d*99;ctx.fillStyle='#697e69';ctx.fillRect(x,y,50,55);ctx.fillStyle='#405946';ctx.fillRect(x,y+52,50,1);
   if(imgs[2].complete&&imgs[2].naturalWidth===432&&imgs[2].naturalHeight===192){ctx.imageSmoothingEnabled=false;ctx.drawImage(imgs[2],(n+3)*48,d*48,48,48,x+3,y+5,44,44)}
  }
 }
 document.getElementById('status').textContent=imgs.every((im,i)=>im.complete&&im.naturalWidth===(i===2?432:288)&&im.naturalHeight===192)?'実PNG 3枚読込済み':'画像未読込または寸法不一致';
}
imgs.forEach(im=>{im.onload=draw;im.onerror=draw});draw();
document.getElementById('toggle').onclick=()=>{if(timer){clearInterval(timer);timer=null;return}timer=setInterval(()=>{frame=(frame+1)%6;draw()},160)};
</script></html>

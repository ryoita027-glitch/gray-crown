<!doctype html><html lang="ja"><meta charset="utf-8"><title>Margaret V22 vs V23 native44 walk</title>
<style>body{background:#1c2626;color:#eae9dd;font:14px system-ui;padding:16px}canvas{image-rendering:pixelated;max-width:100%;height:auto}button{padding:8px}p{max-width:860px}</style>
<h1>マーガレット歩行 A/B — 44px</h1><p>V22（不採用）とV23（実験・HOLD）を、実PNGの同一背景・同一方向・同一コマ・44px最近傍縮小で比較。これは実ゲームCanvas撮影ではありません。実素材の置換はしません。</p>
<button id="play">歩行コマを再生 / 停止</button><span id="status">画像読込中</span><canvas id="board" width="790" height="390"></canvas>
<script>
const paths=['../../assets/character_trials/margaret_walk_adult_mage_v22_motion_trial.png','../../assets/character_trials/margaret_walk_adult_mage_v23_stride_trial.png'];
const imgs=paths.map(p=>{const im=new Image();im.src=p;return im;});
const cv=document.querySelector('#board'),cx=cv.getContext('2d');let frame=0,playing=false,timer;
function draw(){
cx.fillStyle='#1c2626';cx.fillRect(0,0,790,390);cx.font='12px system-ui';cx.textBaseline='top';
cx.fillStyle='#f1eee0';cx.fillText('V22 NO-GO',36,5);cx.fillText('V23 HOLD',410,5);
for(let d=0;d<4;d++)for(let g=0;g<2;g++)for(let f=0;f<6;f++){
 const x=32+g*374+f*58,y=25+d*90;cx.fillStyle=f===frame?'#93a887':'#687d68';cx.fillRect(x,y,51,61);
 cx.fillStyle='#465b48';cx.fillRect(x,y+56,51,1);cx.imageSmoothingEnabled=false;
 if(imgs[g].complete&&imgs[g].naturalWidth===288&&imgs[g].naturalHeight===192)cx.drawImage(imgs[g],f*48,d*48,48,48,x+3,y+8,44,44);
 cx.fillStyle='#f1eee0';cx.fillText(String(f+1),x+22,y+62);
}
['前','左','右','後'].forEach((name,i)=>{cx.fillStyle='#f1eee0';cx.fillText(name,4,50+i*90)});
document.querySelector('#status').textContent=imgs.every(im=>im.complete&&im.naturalWidth===288&&im.naturalHeight===192)?'実PNG読込済み':'読込中または画像不正';
}
imgs.forEach(im=>{im.onload=draw;im.onerror=draw});draw();
document.querySelector('#play').onclick=()=>{playing=!playing;clearInterval(timer);if(playing)timer=setInterval(()=>{frame=(frame+1)%6;draw()},145);draw()};
</script></html>

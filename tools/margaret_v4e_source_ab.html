<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Margaret V4E / original / V5 44px source comparison</title>
<style>
body{font:14px system-ui,sans-serif;background:#ede8df;color:#252628;margin:20px}h1{font-size:21px}
p{max-width:1050px;line-height:1.6}.gallery{overflow:auto;background:white;border:1px solid #bbb}
table{border-collapse:collapse}td,th{border:1px solid #c9c0b5;padding:6px;white-space:nowrap;text-align:center}
th,td:first-child{background:#e9e0d4;font-size:12px}canvas{display:block;width:110px;height:88px;image-rendering:pixelated}
#status{margin:12px 0;color:#a23b2a}
</style>
<h1>マーガレット V4E：原画・主人公・村長・王国使者との44px実素材比較</h1>
<p>同じ背景・接地位置・48→44px最近傍縮小・同じ方向・同じフレームを比較。V4Eは未採用。技術テスト成功は美術採用ではありません。このページは静的な素材比較であり実ゲーム画面ではありません。</p>
<label for="frame">歩行フレーム</label><select id="frame"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
<div id="status" role="status">Loading source PNGs...</div><div class="gallery"><table><thead><tr><th>方向</th><th>カレン</th><th>トリトン</th><th>ソフィ</th><th>マーガレット原画</th><th>V4</th><th>V4E</th><th>村長V5</th><th>王国使者V5</th></tr></thead><tbody id="rows"></tbody></table></div>
<p>顔の成熟度、髪の塊、肩と首、衣装の素材感、本の手持ち位置、足元とタイル尺度を評価。顔・衣装の情報量はまだV5に劣る可能性が高く、現時点はNO-GO。</p>
<script>
'use strict';
const sources=[
['karen','../assets/characters/karen/karen_walk.png',0],
['triton','../assets/characters/triton/triton_walk.png',0],
['sophie','../assets/characters/sophie/sophie_walk.png',0],
['original','../assets/characters/margaret/margaret_walk.png',0],
['v4','../assets/characters/margaret/studies/margaret_walk_v4_study.png',0],
['v4e','../assets/characters/margaret/studies/margaret_walk_v4e_study.png',0],
['mayor','../assets/npc/featured_residents_charm_v5.png',3],
['messenger','../assets/npc/featured_residents_charm_v5.png',4]
];
function load(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error(src));img.src=src;});}
const items=[];
function paint(c,im,col,d,frame){
 const ctx=c.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
 ctx.fillStyle=d%2===0?'#82947a':'#a9a093';ctx.fillRect(0,0,110,88);
 ctx.fillStyle='#556257';ctx.beginPath();ctx.ellipse(55,69,10,3,0,0,Math.PI*2);ctx.fill();
 ctx.drawImage(im,(col*48)+(frame%6)*48,d*48,48,48,33,25,44,44);
}
async function main(){
 for(const [name,src,col] of sources){
  try{const im=await load(src);const expected=col?432:288;if(im.naturalWidth!==expected||im.naturalHeight!==192)throw Error('dimension mismatch '+name);
   items.push({name,im,col});}catch(e){items.push({name,error:String(e)});}
 }
 const tbody=document.getElementById('rows');
 for(let d=0;d<4;d++){const tr=document.createElement('tr'),lab=document.createElement('td');lab.textContent=['正面','左','右','背面'][d];tr.append(lab);
  for(const item of items){const td=document.createElement('td');if(item.error){td.textContent='読み込み失敗';td.title=item.error;}else{const c=document.createElement('canvas');c.width=110;c.height=88;c.dataset.d=d;c.dataset.name=item.name;td.append(c);}tr.append(td);}tbody.append(tr);
 }
 function render(){const f=Number(document.getElementById('frame').value);document.querySelectorAll('canvas').forEach(c=>{const item=items.find(i=>i.name===c.dataset.name);paint(c,item.im,item.col,Number(c.dataset.d),f);});}
 document.getElementById('frame').addEventListener('change',render);render();
 const failures=items.filter(i=>i.error);document.getElementById('status').textContent=failures.length?failures.map(i=>i.error).join(' | '):'8 real PNG sources loaded; visual review pending';
}
main();
</script></html>

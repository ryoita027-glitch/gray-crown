name: Gray Crown Ryune Art V2 Acceptance
on:
  push:
    branches: [pixel-vslice-ryune-art-direction-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gray-crown-ryune-art-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  art-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Real browser v1 versus v2 and story navigation
        run: python tests/browser_ryune_environment_e2e_test.py
      - name: Existing v23 and save regression
        run: npm run check
      - name: Immutable hero source and pixel-runtime checks
        run: |
          python tools/verify_sophie_direction_lock.py
          python tools/verify_margaret_direction_lock.py
          python tools/verify_clean_runtime_sprite_assets.py
          python tools/verify_four_protagonist_appeal_runtime.py
      - name: Save all exact game screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-crown-ryune-art-v2-evidence
          path: prototype_artifacts/ryune_environment_v1/
          if-no-files-found: warn
          retention-days: 14

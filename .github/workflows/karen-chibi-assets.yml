name: Karen Chibi Runtime Assets

on:
  push:
    branches:
      - pixel-karen-chibi-direction
    paths:
      - "tools/generate_karen_prototype_assets.py"
      - "docs/pixel/reference/karen_chibi_direction_v1.png"
      - ".github/workflows/karen-chibi-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixel-karen-chibi-direction
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Karen Chibi runtime sheets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_karen_prototype_assets.py

      - name: Validate generated sheet dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          expected={'idle':4,'walk':6,'turn':3,'talk':4,'surprise':4,'approach':4,'laugh':6,'run':6}
          for name,frames in expected.items():
              p=f'assets/characters/karen/karen_{name}.png'
              im=Image.open(p)
              assert im.size==(48*frames,48*4),(name,im.size)
          print('Karen Chibi sheets: dimensions PASS')
          PY

      - name: Commit generated runtime assets
        run: |
          git config user.name "gray-crown-actions"
          git config user.email "actions@users.noreply.github.com"
          git add assets/characters/karen/karen_*.png
          if git diff --cached --quiet; then
            echo "Karen Chibi runtime assets already current."
            exit 0
          fi
          git commit -m "Generate Karen Chibi Direction Lock v1 runtime assets"
          git push origin HEAD:pixel-karen-chibi-direction

name: Gray Crown Road Cave Combat Quality E2E
on:
  push:
    branches: [pixel-vslice-road-cave-combat-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gray-crown-road-cave-combat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Road cave boss real-browser vertical slice
        run: python tests/browser_road_cave_quality_e2e_test.py
      - name: Full existing regression including stages 00-19
        run: npm run check
      - name: Locked protagonists and pixel-runtime asset checks
        run: |
          python tools/verify_sophie_direction_lock.py
          python tools/verify_margaret_direction_lock.py
          python tools/verify_clean_runtime_sprite_assets.py
          python tools/verify_four_protagonist_appeal_runtime.py
      - name: Save browser screenshots, failures and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-crown-road-cave-combat-quality-evidence
          path: prototype_artifacts/road_cave_combat_v1/
          if-no-files-found: warn
          retention-days: 14

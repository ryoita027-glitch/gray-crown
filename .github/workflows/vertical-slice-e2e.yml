name: Gray Crown Phase 5 Vertical Slice Acceptance
on:
  push:
    branches: [pixel-vslice-integration-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gray-crown-p5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      # npm run check itself starts browser tests; install the browser beforehand.
      # This fixes command order only, not zero-step runner allocation failures.
      - name: Install Chromium before npm run check's browser sub-suite
        run: python -m playwright install --with-deps chromium
      - name: Syntax, content authority, full regressions and existing story 00-19
        run: npm run check
      - name: Verify exact approved four-hero PNG assets
        run: |
          python tools/verify_phase1_asset_manifest.py
          python tools/verify_sophie_direction_lock.py
          python tools/verify_margaret_direction_lock.py
          python tools/verify_clean_runtime_sprite_assets.py
          python tools/verify_four_protagonist_appeal_runtime.py
      - name: Real Pixel-native world and battle rendering regression
        run: python tests/browser_pixel_vslice_acceptance_e2e_test.py
      - name: Existing Ryune appointment Portrait A/B regression
        run: python tests/browser_ryune_acting_e2e_test.py
      - name: Existing Ryune outdoor/interior rendering regression
        run: python tests/browser_ryune_environment_e2e_test.py
      - name: Road/cave terrain, enemy, boss and audio presentation comparisons
        run: python tests/browser_road_cave_quality_e2e_test.py
      - uses: actions/checkout@v4
        name: Check out unchanged production main v23 for genuine save compatibility
        with:
          ref: d689aabb5146c9f45466a4f74f397e664c08fb4f
          path: prototype_artifacts/main_v23_reference
          persist-credentials: false
      - name: Real main v23 save migration, defeat, reversal, mobile and Portrait A/B
        env:
          GRAY_CROWN_MAIN_V23_DIR: prototype_artifacts/main_v23_reference
        run: python tests/browser_phase0_remaining_e2e_test.py
      - name: Entire village to gray-horned beast boss to capital, no Developer Mode
        run: python tests/browser_vertical_slice_e2e_test.py
      - name: Save raw browser screenshots, metrics and incomplete-run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-crown-phase5-real-browser-acceptance
          path: |
            prototype_artifacts/vertical_slice_v1/
            prototype_artifacts/road_cave_combat_v1/
            prototype_artifacts/ryune_acting_v1/
            prototype_artifacts/ryune_environment_v1/
            prototype_artifacts/pixel_vslice_acceptance_v1/
          if-no-files-found: warn
          retention-days: 7

name: Gray Crown Margaret Character Validation CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
concurrency:
  group: gray-crown-margaret-character-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  character-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify project authority
        run: python tools/verify_project_authority.py
      - name: Verify Karen visual regression control
        run: python tools/verify_karen_visual_regression_control.py
      - name: Verify Triton lock
        run: python tools/verify_triton_direction_lock.py
      - name: Verify Sophie lock
        run: python tools/verify_sophie_direction_lock.py
      - name: Verify Margaret direction v2
        run: python tools/verify_margaret_direction_lock.py
      - name: Build Margaret exact-pixel direction evidence
        run: python tools/build_margaret_direction_evidence.py
      - name: Generate Margaret eight-animation prototype
        run: python tools/generate_margaret_prototype_assets.py --out prototype_artifacts/margaret_generated
      - name: Verify Margaret generated animation sheets
        run: python tools/verify_margaret_prototype_assets.py
      - name: Build Margaret animation evidence
        run: python tools/build_margaret_animation_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: gray-crown-margaret-character-validation
          path: |
            prototype_artifacts/margaret_direction_v2/
            prototype_artifacts/margaret_generated/
            prototype_artifacts/margaret_animation_evidence/
          if-no-files-found: error
          retention-days: 14

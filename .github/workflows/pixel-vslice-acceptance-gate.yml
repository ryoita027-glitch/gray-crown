name: Gray Crown Pixel Vslice Acceptance Gate
on:
  push:
    branches: [pixel-vslice-acceptance-gate-v1, fix/phase0-remaining-gates-20261010]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gray-crown-vslice-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Full existing regression
        run: npm run check
      - name: Verify immutable sources and runtime assets
        run: |
          python tools/verify_sophie_direction_lock.py
          python tools/verify_margaret_direction_lock.py
          python tools/verify_clean_runtime_sprite_assets.py
          python tools/verify_four_protagonist_appeal_runtime.py
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Real browser acceptance and evidence
        run: python tests/browser_pixel_vslice_acceptance_e2e_test.py
      - name: Checkout pinned production main v23 for genuine save provenance
        uses: actions/checkout@v4
        with:
          ref: d689aabb5146c9f45466a4f74f397e664c08fb4f
          path: prototype_artifacts/main_v23_reference
          persist-credentials: false
      - name: Real main-v23 Continue and remaining phase-0 browser regressions
        env:
          GRAY_CROWN_MAIN_V23_DIR: prototype_artifacts/main_v23_reference
        run: python tests/browser_phase0_remaining_e2e_test.py
      - name: Upload exact game screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-crown-pixel-vslice-acceptance-evidence
          path: prototype_artifacts/pixel_vslice_acceptance_v1/
          if-no-files-found: warn
          retention-days: 14

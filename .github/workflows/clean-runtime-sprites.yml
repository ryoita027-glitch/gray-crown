name: Gray Crown Clean Runtime Sprite CI
on:
  push:
    branches: [pixel-clean-runtime-integration-v1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gray-crown-clean-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clean-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Rebuild clean world and battle party sheet
        run: python tools/normalize_character_runtime_assets.py
      - name: Verify clean derived/runtime rendering
        run: python tools/verify_clean_runtime_sprite_assets.py
      - name: Existing project regression
        run: |
          python tools/verify_project_authority.py
          python tools/verify_repo_hygiene.py
          npm run check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Actual game browser E2E
        run: python tests/browser_clean_runtime_sprite_e2e_test.py
      - name: Commit normalized binary assets
        if: github.event_name == 'push'
        run: |
          git config user.name "gray-crown-ci"
          git config user.email "gray-crown-ci@users.noreply.github.com"
          git add assets/hero_party_walk.png
          if git diff --cached --quiet; then
            echo "Runtime sprites already normalized"
            exit 0
          fi
          git commit -m "Rebuild clean party sheet from locked runtime sprites"
          git push origin HEAD:pixel-clean-runtime-integration-v1
      - uses: actions/upload-artifact@v4
        with:
          name: gray-crown-clean-runtime-evidence
          path: prototype_artifacts/clean_runtime_sprite_e2e/
          if-no-files-found: error
          retention-days: 14

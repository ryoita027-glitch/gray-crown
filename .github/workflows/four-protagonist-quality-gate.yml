name: Gray Crown Four Protagonist Quality Gate
on:
  push:
    branches: [pixel-margaret-fourth-character-front-gate]
  pull_request:
    branches: [pixel-sophie-steady-hands-validation]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cast-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Verify committed protagonist controls
        run: |
          python tools/verify_karen_visual_regression_control.py
          python tools/verify_triton_direction_lock.py
          python tools/verify_sophie_direction_lock.py
          python tools/verify_margaret_direction_lock.py

      - name: Reproduce and verify Margaret v5 generator
        run: |
          python tools/generate_margaret_direction_v5_candidate.py
          python tools/verify_margaret_direction_v5_candidate.py
          python - <<'PY'
          from PIL import Image,ImageChops
          a=Image.open("prototype_artifacts/margaret_face_v5/margaret_chibi_direction_candidate_v5_48.png").convert("RGBA")
          b=Image.open("docs/pixel/reference/margaret_chibi_direction_lock_v5_48.png").convert("RGBA")
          if ImageChops.difference(a,b).getbbox() is not None:
              raise SystemExit("generated Margaret v5 differs from committed lock")
          print("Margaret v5 reproducibility PASS")
          PY

      - name: Build four-protagonist exact-pixel quality evidence
        run: python tools/build_four_protagonist_quality_evidence.py

      - name: Verify shared quality metrics and runtime contract
        run: python tools/verify_four_protagonist_quality_metrics.py

      - name: Full Gray Crown regression with one flake retry
        run: |
          if npm run check; then
            exit 0
          fi
          echo "::warning::Full regression failed once; retrying the complete gate once for the known frontier browser pathing flake."
          npm run check

      - name: Re-verify immutable controls
        run: |
          python tools/verify_karen_visual_regression_control.py
          python tools/verify_triton_direction_lock.py
          python tools/verify_sophie_direction_lock.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gray-crown-four-protagonist-quality
          path: prototype_artifacts/four_protagonist_quality/
          if-no-files-found: error
          retention-days: 14

name: Gray Crown Four Hero Appeal Upgrade CI
on:
  push:
    branches: [pixel-four-hero-appeal-upgrade-v1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gray-crown-four-hero-appeal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  appeal-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Generate four-hero appeal runtime
        run: python tools/generate_four_hero_appeal_runtime.py
      - name: Verify appeal runtime
        run: python tools/verify_four_hero_appeal_runtime.py
      - name: Build exact evidence
        run: python tools/build_four_hero_appeal_evidence.py
      - name: Full project regression
        run: npm run check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Actual game screenshot / movement gate
        run: python tests/browser_clean_runtime_sprite_e2e_test.py
      - name: Commit exact generated runtime assets
        if: github.event_name == 'push'
        run: |
          git config user.name "gray-crown-ci"
          git config user.email "gray-crown-ci@users.noreply.github.com"
          git add assets/characters/karen assets/characters/triton assets/characters/sophie assets/characters/margaret assets/hero_party_walk.png
          if git diff --cached --quiet; then
            echo "Appeal runtime already synchronized"
          else
            git commit -m "Generate four-hero appeal runtime assets"
            git push origin HEAD:pixel-four-hero-appeal-upgrade-v1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gray-crown-four-hero-appeal-evidence
          path: |
            prototype_artifacts/four_hero_appeal/
            prototype_artifacts/clean_runtime_sprite_e2e/
          if-no-files-found: error
          retention-days: 14

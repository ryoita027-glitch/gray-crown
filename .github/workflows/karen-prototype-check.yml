name: Karen Pixel Prototype CI
# Read-only visual/control gate. Karen is the locked regression control.

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!docs/**"
      - "docs/pixel/reference/**"
      - "!README.txt"
      - "!*.txt"
      - "!.gitignore"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!docs/**"
      - "docs/pixel/reference/**"
      - "!README.txt"
      - "!*.txt"
      - "!.gitignore"
  workflow_dispatch:

concurrency:
  group: karen-pixel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prototype asset dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify Karen visual regression control before work
        run: python tools/verify_karen_visual_regression_control.py

      - name: Build source-faithful Karen Triton identity evidence
        run: python tools/build_karen_triton_identity_evidence.py

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Full prototype regression
        run: npm run prototype-check

      - name: Verify Karen visual regression control after work
        run: python tools/verify_karen_visual_regression_control.py

      - name: Upload visual A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karen-pixel-prototype-evidence
          path: prototype_artifacts/
          if-no-files-found: warn
          retention-days: 14

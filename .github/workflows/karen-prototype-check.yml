name: Karen Pixel Prototype Check
on:
  push:
    branches: [pixel-karen-acting-prototype, pixel-karen-visual-redesign-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          CHROMIUM="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
      - name: Install Karen prototype asset dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate Karen visual-redesign prototype assets
        run: python tools/generate_karen_prototype_assets.py
      - name: Syntax and Node regression
        run: |
          node tests/check-syntax.js
          npm test
      - name: Existing browser regression
        run: |
          python tests/browser_v21_gate.py
          python tests/browser_alpha2_frontier_e2e_test.py
          python tests/browser_alpha2_frontier_second_e2e_test.py
          python tests/browser_devmode_test.py
      - name: Karen Pixel Acting browser test
        run: python tests/browser_karen_pixel_prototype_e2e_test.py
      - name: Upload visual A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karen-pixel-prototype-evidence
          path: prototype_artifacts/
          if-no-files-found: warn

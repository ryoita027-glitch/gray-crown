name: Gray Crown Triton Completion CI
# Manual-only on this development candidate: preserve original test jobs.
# Avoid burning GitHub-hosted minutes on every Draft PR update.
on:
  workflow_dispatch:

concurrency:
  group: gray-crown-triton-completion-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Verify repository hygiene and production baseline
        run: npm run verify-hygiene
      - name: Verify Python source syntax
        run: npm run verify-python-syntax
      - name: Verify current Source of Truth
        run: npm run verify-authority
      - name: Install pinned CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify Karen regression control before work
        run: python tools/verify_karen_visual_regression_control.py
      - name: Verify approved Triton Direction Lock
        run: python tools/verify_triton_direction_lock.py
      - name: Regenerate Triton runtime sheets from approved lock
        run: npm run generate-triton-assets
      - name: Verify Triton runtime sheet dimensions and categories
        run: npm run verify-triton-assets
      - name: Verify committed Triton runtime sheets match deterministic regeneration
        run: npm run verify-triton-completion
      - name: Verify generator produced no committed-file drift
        run: git diff --exit-code -- assets/characters/triton/
      - name: Build Karen/Triton completion evidence
        run: npm run build-triton-completion-evidence
      - name: Verify JavaScript syntax
        run: node tests/check-syntax.js
      - name: Run Node regression suite
        run: npm test
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run all browser gates and preserve per-test logs
        run: python tools/run_browser_suite.py
      - name: Verify Karen regression control after work
        run: python tools/verify_karen_visual_regression_control.py
      - name: Write machine-readable CI state manifest
        if: always()
        run: python tools/write_ci_state_manifest.py
      - name: Write CI gate summary
        if: always()
        run: |
          {
            echo "## Gray Crown — Triton completion automation"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Job status: **${{ job.status }}**"
            echo "- Approved source: Triton Chibi Direction Lock v1."
            echo "- Automatic: lock integrity, 8-sheet regeneration, exact committed-source match, Node tests, all browser gates, failure logs, evidence, Karen hash."
            echo "- Not automatic: main merge, formal Pixel-native adoption, Sophie visual approval."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload CI, browser diagnostics and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-crown-triton-completion-evidence
          path: |
            prototype_artifacts/
            test-results/
            playwright-report/
            docs/pixel/reference/sophie_steady_hands_front_candidate_v1_48.png
          if-no-files-found: warn
          retention-days: 14

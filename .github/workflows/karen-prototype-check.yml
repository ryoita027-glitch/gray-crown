name: Karen Pixel Prototype CI

on:
  push:
    branches:
      - pixel-karen-acting-prototype
      - pixel-karen-chibi-direction
      - repo-actions-consolidation
    paths-ignore:
      - "docs/**"
      - "README.txt"
      - "*.txt"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: karen-pixel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prototype asset dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Karen prototype assets
        run: python tools/generate_karen_prototype_assets.py --out assets/characters/karen

      - name: Persist generated prototype assets
        run: |
          git config user.name "gray-crown-prototype-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/characters/karen/*.png
          if git diff --cached --quiet; then
            echo "Prototype assets are already current."
          else
            git commit -m "Generate Karen prototype assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          CHROMIUM="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium

      - name: Full prototype regression
        run: npm run prototype-check

      - name: Upload visual A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karen-pixel-prototype-evidence
          path: prototype_artifacts/
          if-no-files-found: warn

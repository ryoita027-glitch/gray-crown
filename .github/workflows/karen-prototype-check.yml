name: Karen Pixel Prototype CI
# Karen Chibi integration gate

on:
  push:
    branches:
      - pixel-karen-acting-prototype
      - pixel-karen-chibi-direction
      - repo-actions-consolidation
    paths-ignore:
      - "docs/**"
      - "README.txt"
      - "*.txt"
      - ".gitignore"
  pull_request:
    branches:
      - pixel-karen-acting-prototype
    paths-ignore:
      - "docs/**"
      - "README.txt"
      - "*.txt"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: karen-pixel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prototype asset dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          CHROMIUM="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium

      - name: Karen Chibi integration evidence gate
        run: python tests/browser_karen_pixel_prototype_e2e_test.py

      - name: Full prototype regression
        run: npm run prototype-check

      - name: Upload visual A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karen-pixel-prototype-evidence
          path: prototype_artifacts/
          if-no-files-found: warn

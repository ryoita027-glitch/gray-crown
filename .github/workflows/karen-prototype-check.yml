name: Karen Pixel Prototype CI
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "docs/pixel/reference/**"
      - "docs/audit/**"
      - "docs/visual/SOURCE_OF_TRUTH_STATUS.md"
      - "!README.txt"
      - "!*.txt"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!docs/**"
      - "docs/pixel/reference/**"
      - "docs/audit/**"
      - "docs/visual/SOURCE_OF_TRUTH_STATUS.md"
      - "!README.txt"
      - "!*.txt"
  workflow_dispatch:
concurrency:
  group: karen-pixel-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository hygiene and production baseline
        run: npm run verify-hygiene
      - name: Verify Python source syntax
        run: npm run verify-python-syntax
      - name: Verify project authority and current work gate
        run: npm run verify-authority
      - name: Install pinned CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify Karen visual regression control before work
        run: python tools/verify_karen_visual_regression_control.py
      - name: Verify Triton Chibi Direction Lock v1
        run: python tools/verify_triton_direction_lock.py
      - name: Build committed-source Karen Triton evidence
        run: python tools/build_karen_triton_identity_evidence.py
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Full prototype regression
        run: npm run prototype-check
      - name: Verify Triton generated runtime sheets
        run: python tools/verify_triton_prototype_assets.py
      - name: Verify committed Triton runtime sheets match generator
        run: git diff --exit-code -- assets/characters/triton/
      - name: Verify Karen visual regression control after work
        run: python tools/verify_karen_visual_regression_control.py
      - name: Write machine-readable CI state manifest
        if: always()
        run: python tools/write_ci_state_manifest.py
      - name: Write CI gate summary
        if: always()
        run: |
          {
            echo "## Gray Crown Triton completion gate"
            echo ""
            echo "- Commit: \${GITHUB_SHA}"
            echo "- Job status: **${{ job.status }}**"
            echo "- Triton authority: user-approved Chibi Direction Lock v1."
            echo "- Karen: locked regression control and unchanged by this pipeline."
            echo "- Required: 8Animation + actual-game Medium44 + 48/44/41 + full regression."
            echo "- Sophie remains paused until Triton PASS and Standard update."
            echo "- main merge / formal Pixel-native adoption: not automated."
          } >> "\${GITHUB_STEP_SUMMARY}"
      - name: Upload CI and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karen-pixel-prototype-evidence
          path: |
            prototype_artifacts/
            assets/characters/triton/*.png
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

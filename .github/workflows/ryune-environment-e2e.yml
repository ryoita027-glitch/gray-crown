name: Gray Crown Ryune Environment E2E
on:
  push:
    branches: [pixel-vslice-ryune-environment-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gray-crown-ryune-environment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Existing game and save regression
        run: npm run check
      - name: Four-character source/runtimes remain untouched
        run: |
          python tools/verify_sophie_direction_lock.py
          python tools/verify_margaret_direction_lock.py
          python tools/verify_clean_runtime_sprite_assets.py
          python tools/verify_four_protagonist_appeal_runtime.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Real browser Ryune indoor/outdoor scene and path gates
        run: python tests/browser_ryune_environment_e2e_test.py
      - name: Archive before/after real-game screenshots and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-crown-ryune-environment-v1-evidence
          path: prototype_artifacts/ryune_environment_v1/
          if-no-files-found: warn
          retention-days: 14

name: Gray Crown Ryune Acting E2E
on:
  push:
    branches: [pixel-vslice-ryune-acting-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gray-crown-ryune-acting-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Source-of-truth and full existing regression
        run: npm run check
      - name: Four protagonist locked runtime sprite regression
        run: |
          python tools/verify_phase1_asset_manifest.py
          python tools/verify_sophie_direction_lock.py
          python tools/verify_margaret_direction_lock.py
          python tools/verify_clean_runtime_sprite_assets.py
          python tools/verify_four_protagonist_appeal_runtime.py
      - name: Install headless Chromium once
        run: python -m playwright install --with-deps chromium
      - name: Real 23-line appointment / four-hero acting / Portrait A-B / save gate
        run: python tests/browser_ryune_acting_e2e_test.py
      - name: Preserve unretouched game screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-crown-ryune-acting-v1-evidence
          path: prototype_artifacts/ryune_acting_v1/
          if-no-files-found: warn
          retention-days: 7

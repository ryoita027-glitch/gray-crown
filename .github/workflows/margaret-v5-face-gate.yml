name: Gray Crown Margaret v5 Face Gate
on:
  push:
    branches: [pixel-margaret-fourth-character-front-gate]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  face-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify locked protagonist controls
        run: |
          python tools/verify_karen_visual_regression_control.py
          python tools/verify_triton_direction_lock.py
          python tools/verify_sophie_direction_lock.py
      - name: Generate Margaret v5 face candidate
        run: python tools/generate_margaret_direction_v5_candidate.py
      - name: Verify Margaret v5 face candidate
        run: python tools/verify_margaret_direction_v5_candidate.py
      - name: Build exact Medium44 evidence
        run: python tools/build_margaret_v5_candidate_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: gray-crown-margaret-v5-face-gate
          path: prototype_artifacts/margaret_face_v5/
          if-no-files-found: error
          retention-days: 14

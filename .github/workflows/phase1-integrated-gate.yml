name: Gray Crown Phase 1 Integrated Acceptance
on:
  push:
    branches: [integration/phase1-pixel-native-baseline-20261010]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-pixel-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrated-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Lightweight phase (syntax, repo, authority, node, byte locks)
        run: |
          npm run verify-hygiene
          npm run verify-authority
          python tools/verify_phase1_asset_manifest.py
          npm run verify-python-syntax
          node tests/check-syntax.js
          npm test
          python tools/verify_sophie_direction_lock.py
          python tools/verify_margaret_direction_lock.py
          python tools/verify_clean_runtime_sprite_assets.py
          python tools/verify_four_protagonist_appeal_runtime.py
      - name: Install Chromium only after lightweight gates pass
        run: python -m playwright install --with-deps chromium
      - name: Existing browser regression (remainder of npm check)
        run: npm run browser-test
      - name: Four-hero browser and commercial presentation
        run: |
          python tests/browser_four_protagonist_appeal_e2e_test.py
          python tests/browser_commercial_polish_e2e_test.py
      - name: End-to-end village / road / combat / Continue
        run: python tests/browser_pixel_vslice_acceptance_e2e_test.py
      - uses: actions/checkout@v4
        name: Read-only pinned main v23 reference for genuine save fixture
        with:
          ref: d689aabb5146c9f45466a4f74f397e664c08fb4f
          path: prototype_artifacts/main_v23_reference
          persist-credentials: false
      - name: Main v23 fresh save / actual loss / two-cell / mobile / Portrait A-B
        env:
          GRAY_CROWN_MAIN_V23_DIR: prototype_artifacts/main_v23_reference
        run: python tests/browser_phase0_remaining_e2e_test.py
      - name: Ryune pixel environment real Chromium E2E
        run: python tests/browser_ryune_environment_e2e_test.py
      - name: Upload genuine scene screenshots and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-integrated-vslice-evidence
          path: |
            prototype_artifacts/pixel_vslice_acceptance_v1/
            prototype_artifacts/ryune_environment_v1/
            prototype_artifacts/four_protagonist_appeal_v1/
            prototype_artifacts/commercial_polish_v1/
          if-no-files-found: warn
          retention-days: 7

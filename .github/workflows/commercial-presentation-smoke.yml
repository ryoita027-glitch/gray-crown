name: Gray Crown Commercial Presentation Smoke
on:
  push:
    branches: [pixel-commercial-presentation-pass-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gray-crown-commercial-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      - name: Commercial real-game E2E
        run: python tests/browser_four_protagonist_appeal_e2e_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: gray-crown-commercial-presentation-evidence
          path: prototype_artifacts/four_protagonist_appeal_v1/
          if-no-files-found: error
          retention-days: 14

name: Karen Prototype Asset Generator
on:
  push:
    branches: [pixel-karen-acting-prototype]
    paths:
      - tools/generate_karen_prototype_assets.py
      - js/data/animations.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/generate_karen_prototype_assets.py --out assets/characters/karen
      - name: Commit generated prototype assets
        run: |
          git config user.name "gray-crown-prototype-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/characters/karen/*.png
          if git diff --cached --quiet; then
            echo "Assets already current."
          else
            git commit -m "Generate Karen 48px prototype assets"
            git push origin HEAD:pixel-karen-acting-prototype
          fi
